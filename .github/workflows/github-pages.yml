name: Publish Glass to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.setup.outputs.enabled }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check Pages opt-in
        id: setup
        run: node scripts/github-pages-setup.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Read the actual deployment URL
        if: steps.setup.outputs.enabled == 'true'
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Set up Node
        if: steps.setup.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        if: steps.setup.outputs.enabled == 'true'
        run: npm ci
      - name: Install diagram renderer
        if: steps.setup.outputs.enabled == 'true'
        run: npx playwright install --with-deps chromium
      - name: Restore public renderer caches
        if: steps.setup.outputs.enabled == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .studio/assets
            .studio/render-cache/mermaid
            .studio/render-cache/charts
          key: ${{ runner.os }}-glass-public-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-glass-public-${{ hashFiles('package-lock.json') }}-
      - name: Build the static reader
        if: steps.setup.outputs.enabled == 'true'
        run: npm run build:github-pages -- --root "$GITHUB_WORKSPACE"
        env:
          GLASS_PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Upload only public output
        if: steps.setup.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the accepted artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Report publication
        env:
          PUBLISHED_URL: ${{ steps.deployment.outputs.page_url }}
        run: printf '## Published\n\n%s\n' "$PUBLISHED_URL" >> "$GITHUB_STEP_SUMMARY"
